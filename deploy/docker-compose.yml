name: ${COMPOSE_PROJECT_NAME:-revint-agent}

services:
  n8n-db:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE in deploy/.env}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${N8N_DB_NAME:-n8n}
      POSTGRES_USER: ${N8N_DB_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD in deploy/.env}
    volumes:
      - n8n_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_DB_USER:-n8n} -d ${N8N_DB_NAME:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - agent_private

  reporting-db:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE in deploy/.env}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${REPORTING_DB_NAME:-revenue_reporting}
      POSTGRES_USER: ${REPORTING_DB_ADMIN_USER:-revint_admin}
      POSTGRES_PASSWORD: ${REPORTING_DB_ADMIN_PASSWORD:?Set REPORTING_DB_ADMIN_PASSWORD in deploy/.env}
    volumes:
      - reporting_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${REPORTING_DB_ADMIN_USER:-revint_admin} -d ${REPORTING_DB_NAME:-revenue_reporting}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - agent_private

  n8n:
    image: ${N8N_IMAGE:?Set N8N_IMAGE in deploy/.env}
    restart: unless-stopped
    depends_on:
      n8n-db:
        condition: service_healthy
      reporting-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD in deploy/.env}

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in deploy/.env}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678/}
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-1}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Etc/UTC}
      TZ: ${TZ:-Etc/UTC}

      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"

      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-336}

      REPORTING_DB_HOST: reporting-db
      REPORTING_DB_PORT: 5432
      REPORTING_DB_NAME: ${REPORTING_DB_NAME:-revenue_reporting}
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - agent_private
      - agent_egress

  ingress:
    profiles: ["ingress"]
    image: ${NGINX_IMAGE:?Set NGINX_IMAGE in deploy/.env}
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    ports:
      - "${INGRESS_BIND_ADDRESS:-127.0.0.1}:${INGRESS_HTTP_PORT:-8080}:8080"
      - "${INGRESS_BIND_ADDRESS:-127.0.0.1}:${INGRESS_HTTPS_PORT:-8443}:8443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
      PUBLIC_HTTPS_ORIGIN: ${PUBLIC_HTTPS_ORIGIN:-https://localhost:8443}
      SSO_ENABLED: ${SSO_ENABLED:-false}
      SSO_IDENTITY_PROVIDER_KEY: ${SSO_IDENTITY_PROVIDER_KEY:-oidc}
      SSO_INTERNAL_API_KEY: ${SSO_INTERNAL_API_KEY:-disabled}
      NGINX_ENVSUBST_FILTER: "^(PUBLIC_DOMAIN|PUBLIC_HTTPS_ORIGIN|SSO_ENABLED|SSO_IDENTITY_PROVIDER_KEY|SSO_INTERNAL_API_KEY)$"
    volumes:
      - ./nginx/revint.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./tls/tls.crt:/etc/nginx/tls/tls.crt:ro
      - ./tls/tls.key:/etc/nginx/tls/tls.key:ro
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - SETGID
      - SETUID
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:8081/healthz | grep -qx ok",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - agent_private
      - ingress_public

  oauth2-proxy:
    profiles: ["sso"]
    image: ${OAUTH2_PROXY_IMAGE:?Set OAUTH2_PROXY_IMAGE in deploy/.env}
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${SSO_OIDC_ISSUER_URL:?Set SSO_OIDC_ISSUER_URL in deploy/.env}
      OAUTH2_PROXY_CLIENT_ID: ${SSO_OIDC_CLIENT_ID:?Set SSO_OIDC_CLIENT_ID in deploy/.env}
      OAUTH2_PROXY_CLIENT_SECRET: ${SSO_OIDC_CLIENT_SECRET:?Set SSO_OIDC_CLIENT_SECRET in deploy/.env}
      OAUTH2_PROXY_COOKIE_SECRET: ${SSO_COOKIE_SECRET:?Set SSO_COOKIE_SECRET in deploy/.env}
      OAUTH2_PROXY_EMAIL_DOMAINS: ${SSO_ALLOWED_EMAIL_DOMAINS:?Set SSO_ALLOWED_EMAIL_DOMAINS in deploy/.env}
      OAUTH2_PROXY_REDIRECT_URL: ${PUBLIC_HTTPS_ORIGIN:-https://localhost:8443}/oauth2/callback
      OAUTH2_PROXY_SCOPE: "openid profile email"
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_UPSTREAMS: "static://202"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_USER_ID_CLAIM: "sub"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_HTTPONLY: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: "lax"
      OAUTH2_PROXY_COOKIE_NAME: "_revint_sso"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - agent_private
      - agent_egress

volumes:
  n8n_data:
  n8n_db_data:
  reporting_db_data:

networks:
  agent_private:
    internal: true
  agent_egress:
  ingress_public:
